name: Sync from IBM GitHub

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:         # also allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pull from IBM and push to mirror
        env:
          IBM_GH_TOKEN: ${{ secrets.IBM_GH_TOKEN }}
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          # Override the checkout action's credential helper so our PAT is used for github.com
          git config --global --unset-all credential.helper || true
          git config --global credential.helper store
          echo "https://x-access-token:${IBM_GH_TOKEN}@github.ibm.com" >> ~/.git-credentials
          echo "https://x-access-token:${MIRROR_PUSH_TOKEN}@github.com" >> ~/.git-credentials

          git remote add ibm https://github.ibm.com/ALM-Consumability/M-GRAT.git
          git fetch ibm main

          # Only push and deploy if there are new commits
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse ibm/main)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "No new commits — skipping push and deploy."
            exit 0
          fi

          git reset --hard ibm/main
          git remote set-url origin https://github.com/Sheeshcodes/M-GRAT-beta-vercel.git
          git push origin main --force
