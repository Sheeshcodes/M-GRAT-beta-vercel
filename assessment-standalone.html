<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maximo Application Suite — Growth readiness assessment</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@300&display=swap"
    rel="stylesheet"
  />

  <!-- Carbon Web Components (v2) -->
  <script type="module" src="https://1.www.s81c.com/common/carbon/web-components/tag/v2/latest/button.min.js"></script>
  <script type="module" src="https://1.www.s81c.com/common/carbon/web-components/tag/v2/latest/checkbox.min.js"></script>
  <script type="module" src="https://1.www.s81c.com/common/carbon/web-components/tag/v2/latest/radio-button.min.js"></script>
  <script type="module" src="https://1.www.s81c.com/common/carbon/web-components/tag/v2/latest/toggle-tip.min.js"></script>
  <script type="module" src="https://1.www.s81c.com/common/carbon/web-components/tag/v2/latest/progress-bar.min.js"></script>
  <script type="module" src="https://1.www.s81c.com/common/carbon/web-components/tag/v2/latest/notification.min.js"></script>

  <style>
/* ------------------------------------------------------------------
   Carbon white theme tokens (subset) — shared by page + components
   ------------------------------------------------------------------ */
:root {
  --cds-background: #ffffff;
  --cds-layer: #f4f4f4;
  --cds-layer-hover: #e8e8e8;
  --cds-layer-active: #c6c6c6;
  --cds-layer-selected: #e0e0e0;
  --cds-layer-selected-hover: #d1d1d1;
  --cds-layer-accent: #e0e0e0;
  --cds-field: #f4f4f4;
  --cds-border-subtle: #e0e0e0;
  --cds-border-strong: #8d8d8d;
  --cds-border-interactive: #0f62fe;
  --cds-text-primary: #161616;
  --cds-text-secondary: #525252;
  --cds-text-placeholder: #a8a8a8;
  --cds-text-on-color: #ffffff;
  --cds-text-error: #da1e28;
  --cds-text-disabled: rgba(22, 22, 22, 0.25);
  --cds-icon-primary: #161616;
  --cds-icon-secondary: #525252;
  --cds-icon-on-color: #ffffff;
  --cds-link-primary: #0f62fe;
  --cds-link-primary-hover: #0043ce;
  --cds-focus: #0f62fe;
  --cds-focus-inset: #ffffff;
  --cds-interactive: #0f62fe;
  --cds-support-error: #da1e28;
  --cds-support-success: #24a148;
  --cds-support-info: #0043ce;
  --cds-button-primary: #0f62fe;
  --cds-button-primary-hover: #0050e6;
  --cds-button-primary-active: #002d9c;
  --cds-button-secondary: #393939;
  --cds-button-secondary-hover: #474747;
  --cds-button-secondary-active: #6f6f6f;
  --cds-button-disabled: #c6c6c6;
  --cds-background-inverse: #393939;
  --cds-text-inverse: #ffffff;
  --cds-icon-inverse: #ffffff;
  --cds-notification-error-background: #fff1f1;
  --cds-notification-error-border: rgba(218, 30, 40, 0.3);

  /* Page-specific */
  --page-blue: #0f62fe;
  --page-rule: #e4e4e4;
  --page-chip: #f7f7f7;
  --page-sidebar: #f4f4f4;
  --page-sidebar-end: #b2cdff;
  --sidebar-width: 34%;

  --font-sans: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", Menlo, Consolas, monospace;
  --font-condensed: "IBM Plex Sans Condensed", var(--font-sans);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-anchor: none; }
body {
  font-family: var(--font-sans);
  color: var(--cds-text-primary);
  background: var(--cds-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
p { margin: 0; }

/* ------------------------------------------------------------------
   Layout
   ------------------------------------------------------------------ */
.page {
  display: flex;
  align-items: stretch;
  min-height: 100vh;
}

/* Sidebar ---------------------------------------------------------- */
.sidebar {
  position: sticky;
  top: 0;
  flex: 0 0 clamp(340px, var(--sidebar-width), 588px);
  height: 100vh;
  background: linear-gradient(180deg, var(--page-sidebar) 0%, var(--page-sidebar-end) 100%);
  padding: 38px 36px 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.sidebar__product {
  font-size: 14px;
  line-height: 18px;
  letter-spacing: 0.16px;
}
.sidebar__product strong { font-weight: 600; }
.sidebar__version {
  font-size: 12px;
  line-height: 22.4px;
  letter-spacing: -0.07px;
  font-weight: 400;
  color: #78a9ff;
}
.sidebar__hero {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
}
.sidebar__title {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(36px, 3.6vw, 48px);
  line-height: 1;
  letter-spacing: 0;
  color: #000;
  max-width: 406px;
  margin: 0;
}
.sidebar__page {
  padding-top: 16px;
  font-size: 14px;
  line-height: 20px;
  letter-spacing: 0.16px;
}
.sidebar__logo {
  flex: 0 0 auto;
  height: 20px;
  width: 54px;
  display: block;
  margin-bottom: 45px;
}
.sidebar__logo img { width: 54px; height: 20px; display: block; }
/* Illustration sits on the gradient at the foot of the column, spanning its
   full width at the design proportions (588×332 at the design width). On a
   short viewport it crops from the bottom (the hand) rather than squashing. */
.sidebar__art {
  flex: 0 1 auto;
  width: calc(100% + 72px);
  margin: 0 -36px 0;
  aspect-ratio: 2000 / 1128;
  min-height: 120px;
  overflow: hidden;
}
.sidebar__art img {
  width: 100%;
  height: auto;
  display: block;
  pointer-events: none;
  user-select: none;
}

/* Main ------------------------------------------------------------- */
.main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  justify-content: center;
}
.content {
  width: 100%;
  max-width: 746px; /* 634 content + 56px gutters */
  padding: 40px 56px 120px;
}

/* Progress ---------------------------------------------------------- */
.progress {
  position: sticky;
  top: var(--progress-top, 0px);
  z-index: 20;
  width: 634px;
  max-width: 100%;
  height: 32px;
  display: flex;
  align-items: center;
  background: var(--cds-background);
  /* extend the white backing so content slides under it without a hard edge */
  box-shadow: 0 -40px 0 0 var(--cds-background), 0 12px 12px -4px var(--cds-background);
}
.progress cds-progress-bar {
  width: 100%;
  --cds-border-subtle: var(--page-rule);
  --cds-interactive: var(--page-blue);
}

/* Sections ------------------------------------------------------------- */
.sections {
  display: flex;
  flex-direction: column;
  gap: 64px;
  max-width: 634px;
  padding: 26px 0 30px;
}
.divider {
  display: flex;
  align-items: center;
  gap: 16px;
}
.divider__label {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 11px;
  line-height: 17.6px;
  letter-spacing: 1.76px;
  text-transform: uppercase;
  color: var(--page-blue);
  white-space: nowrap;
}
.divider__rule { flex: 1 1 auto; height: 1px; background: var(--page-rule); }

.question { padding-top: 24px; }
.question__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  min-height: 32px;
}
.question__title-wrap { flex: 1 1 auto; min-width: 0; max-width: 408px; padding-top: 2px; }
.question__title {
  margin: 0;
  font-weight: 600;
  font-size: 20px;
  line-height: 26.4px;
  letter-spacing: -0.32px;
  color: var(--cds-text-primary);
}
.question__optional {
  display: inline-block;
  margin: 6px 0 0 9px;
  padding: 3px 7px;
  background: var(--page-chip);
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 10px;
  line-height: 13.2px;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  color: #8d8d8d;
}

/* Question guidance (toggletip) ---------------------------------------- */
.q-info {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  margin-top: -2px;
  border-radius: 16px;
  background: var(--page-chip);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 110ms cubic-bezier(0.2, 0, 0.38, 0.9);
}
.q-info:hover { background: var(--cds-layer-hover); }
.q-info:active { background: var(--cds-layer-active); }
/* The toggletip's (empty) label span carries an 8px end margin inside the
   shadow root, which shifts the trigger 4px right; pull it back so the icon
   sits in the centre of the 32px circle. */
.q-info cds-toggletip { display: flex; margin-left: -8px; }
.q-info svg { width: 20px; height: 20px; fill: var(--cds-icon-primary); display: block; }
.q-info__body { display: block; font-size: 14px; line-height: 18px; letter-spacing: 0.16px; }
.q-info__body strong { display: block; font-weight: 600; margin-bottom: 4px; }

/* Matrix table ---------------------------------------------------------- */
.matrix {
  display: grid;
  grid-template-columns: minmax(0, 1fr) repeat(var(--matrix-cols, 3), 96px);
  margin-top: 14px;
  width: 100%;
}
.matrix__th {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 54px;
  padding: 6px 8px 14px 6px;
  border-bottom: 1px solid var(--cds-border-subtle);
  font-weight: 500;
  font-size: 13px;
  line-height: 16.9px;
  color: var(--cds-text-secondary);
  text-align: center;
  text-wrap: balance;
}
.matrix__th--theme { justify-content: flex-start; padding-left: 0; text-align: left; }

.matrix__row { display: contents; }
.matrix__td {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 110px;
  border-bottom: 1px solid var(--page-rule);
  transition: background-color 70ms cubic-bezier(0.2, 0, 0.38, 0.9);
}
.matrix__td--theme {
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 14px 14px 14px 0;
}
.matrix__row:hover .matrix__td { background: #fafafa; }
.matrix__theme {
  font-weight: 700;
  font-size: 14px;
  line-height: 22.4px;
  color: var(--cds-text-primary);
  max-width: 207px;
}
.matrix__desc {
  padding-top: 2px;
  font-family: var(--font-condensed);
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 0.32px;
  color: var(--cds-text-secondary);
  max-width: 207px;
}
.matrix__error {
  display: none;
  padding-top: 6px;
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 0.32px;
  color: var(--cds-text-error);
}
.matrix__row.is-invalid .matrix__error { display: block; }
.matrix__row.is-invalid .matrix__td { background: #fff1f1; }
.matrix__td cds-radio-button { display: block; padding-left: 6px; }

/* Selectable tiles (checkbox / radio) ------------------------------------ */
.tiles {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 22px;
  width: 100%;
}
.tile {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
  padding: 16px;
  background: var(--cds-layer);
  cursor: pointer;
  user-select: none;
  outline: 2px solid transparent;
  outline-offset: -2px;
  transition: background-color 70ms cubic-bezier(0.2, 0, 0.38, 0.9),
              outline-color 70ms cubic-bezier(0.2, 0, 0.38, 0.9);
}
.tile:hover { background: var(--cds-layer-hover); }
.tile:active { background: var(--cds-layer-active); }
.tile.is-selected { background: var(--cds-layer-selected); }
.tile.is-selected:hover { background: var(--cds-layer-selected-hover); }
.tile.is-selected::after {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--cds-border-interactive);
}
.tile:focus-within { outline-color: var(--cds-focus); }
.tile.is-disabled { cursor: not-allowed; color: var(--cds-text-disabled); background: var(--cds-layer); }
.tile cds-checkbox,
.tile cds-radio-button {
  display: block;
  pointer-events: auto;
  --cds-text-primary: #161616;
}

.tiles__error {
  display: none;
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 0.32px;
  color: var(--cds-text-error);
}
.tiles.is-invalid .tiles__error { display: block; }
.tiles.is-invalid .tile { outline-color: var(--cds-support-error); }

/* Actions ------------------------------------------------------------- */
.actions-bar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  margin-top: 34px;
  padding: 16px 0 24px;
  background: var(--cds-background);
  box-shadow: 0 -1px 0 0 var(--page-rule);
  transition: transform 240ms cubic-bezier(0.2, 0, 0.38, 0.9),
              box-shadow 240ms cubic-bezier(0.2, 0, 0.38, 0.9);
}
.actions-bar.is-hidden { transform: translateY(100%); }
.actions-bar.is-docked { box-shadow: none; } /* resting in flow at the end of the page */
.actions {
  display: flex;
  gap: 1px;
  justify-content: flex-end;
  width: 548px;
  max-width: 100%;
}
.actions cds-button { flex: 1 1 0; min-width: 0; }
.actions cds-button[kind="secondary"] {
  --cds-button-secondary: #f7f7f7;
  --cds-button-secondary-hover: #e8e8e8;
  --cds-button-secondary-active: #c6c6c6;
  --cds-text-on-color: #161616;
  --cds-icon-on-color: #161616;
}
.actions cds-button::part(button) {
  width: 100%;
  min-height: 48px;
  padding-inline: 16px;
  font-size: 15px;
  letter-spacing: 0.15px;
}
.actions .btn-icon { width: 16px; height: 16px; fill: currentColor; }

.form-error {
  margin: 24px 0 0;
  max-width: 634px;
}
.content { padding-bottom: 48px; }
.form-error[hidden] { display: none; }

/* Screen-reader only */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ------------------------------------------------------------------
   Responsive
   ------------------------------------------------------------------ */
@media (max-width: 767px) {
  .page { flex-direction: column; }
  /* The banner is fixed and the main column is padded by the banner's
     EXPANDED height, so collapsing it never reflows the page (and never
     fights the browser's scroll anchoring). */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
    flex: 0 0 auto;
    max-width: none;
    height: auto;
    min-height: 0;
    padding: 24px 24px 0;
    transition: padding 220ms cubic-bezier(0.2, 0, 0.38, 0.9);
  }
  .main { padding-top: var(--banner-h, 0px); }
  .sidebar__hero {
    padding: 40px 0 32px;
    transition: padding 220ms cubic-bezier(0.2, 0, 0.38, 0.9);
  }
  .sidebar__title { transition: font-size 220ms cubic-bezier(0.2, 0, 0.38, 0.9); }
  .sidebar__hero { flex: 0 0 auto; }
  .sidebar__art { display: none; }
  .sidebar__logo { margin-bottom: 24px; }
  .content { padding: 32px 24px 48px; max-width: none; }
  .progress, .actions { width: 100%; }
  .actions-bar { padding-bottom: max(16px, env(safe-area-inset-bottom)); }

  /* Collapsed banner: product line small, then the stage + page counter only. */
  .sidebar.is-compact { padding: 8px 24px 10px; }
  .sidebar.is-compact .sidebar__product { font-size: 11px; line-height: 14px; }
  .sidebar.is-compact .sidebar__product strong { font-weight: 600; }
  .sidebar.is-compact .sidebar__product br { display: none; }
  .sidebar.is-compact .sidebar__product strong::after { content: " · "; font-weight: 400; }
  .sidebar.is-compact .sidebar__version,
  .sidebar.is-compact .sidebar__logo { display: none; }
  .sidebar.is-compact .sidebar__hero {
    flex-direction: row;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0 0;
  }
  .sidebar.is-compact .sidebar__title { font-size: 18px; line-height: 22px; max-width: none; }
  .sidebar.is-compact .sidebar__page { padding-top: 0; font-size: 12px; white-space: nowrap; }
}
@media (max-width: 640px) {
  .matrix { grid-template-columns: minmax(0, 1fr) repeat(var(--matrix-cols, 3), 64px); }
  .matrix__th { font-size: 12px; padding-inline: 2px; }
  .matrix__td cds-radio-button { padding-left: 0; }
  .content { padding: 24px 16px 48px; }
  .sidebar { padding-inline: 16px; }
  .sidebar.is-compact { padding-inline: 16px; }
}

/* Touch devices: 44px minimum hit areas on the small controls. */
@media (pointer: coarse) {
  .q-info { width: 44px; height: 44px; border-radius: 22px; margin-top: -7px; }
  .matrix__td { min-height: 88px; cursor: pointer; }
  /* The radio itself stays 18px; the padded host makes the tap zone 44px. */
  .matrix__td cds-radio-button { padding: 13px; margin: 0; }
  .tile { min-height: 52px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

/* ------------------------------------------------------------------
   Report Layout & Component Styles (Report_Spec_Binder.md)
   ------------------------------------------------------------------ */
.report-view {
  background: var(--cds-background);
  min-height: 100vh;
  width: 100%;
}

.rep-container {
  max-width: 960px;
  margin: 0 auto;
  padding: 48px 24px 80px;
  font-family: var(--font-sans);
  color: var(--cds-text-primary);
}

/* Header ----------------------------------------------------------- */
.rep-header {
  margin-bottom: 40px;
  border-bottom: 1px solid var(--cds-border-subtle);
  padding-bottom: 32px;
}
.rep-header__logo {
  margin-bottom: 24px;
}
.rep-header__titles {
  position: relative;
}
.rep-title {
  font-size: 28px;
  line-height: 36px;
  font-weight: 600;
  color: var(--cds-button-primary-hover); /* blue-70 */
  margin: 0 0 8px;
}
.rep-subtitle {
  font-size: 14px;
  line-height: 18px;
  color: var(--cds-text-secondary);
  margin: 0 0 24px;
}

.rep-meta-edit {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  background: var(--cds-layer);
  padding: 16px 20px;
  border-radius: 4px;
}
.rep-meta-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.rep-meta-field label {
  font-size: 11px;
  font-weight: 500;
  color: var(--cds-text-secondary);
  text-transform: uppercase;
}
.rep-meta-field input {
  font-family: var(--font-sans);
  font-size: 14px;
  padding: 6px 12px;
  border: 1px solid var(--cds-border-subtle);
  background: var(--cds-background);
  color: var(--cds-text-primary);
  border-radius: 2px;
  width: 220px;
  max-width: 100%;
}
.rep-meta-field input:focus {
  outline: 2px solid var(--cds-focus);
}
.rep-meta-badge {
  margin-left: auto;
}

/* General Card ----------------------------------------------------- */
.rep-card {
  background: var(--cds-background);
  border: 1px solid var(--cds-border-subtle);
  border-radius: 4px;
  padding: 24px;
  margin-bottom: 24px;
}
.rep-card__title {
  font-size: 20px;
  line-height: 26px;
  font-weight: 600;
  margin: 0 0 8px;
  color: var(--cds-text-primary);
}
.rep-card__desc {
  font-size: 14px;
  line-height: 20px;
  color: var(--cds-text-secondary);
  margin: 0 0 24px;
}

/* Act 1 Grid ------------------------------------------------------- */
.rep-grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 24px;
  margin-bottom: 24px;
}

.index-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: var(--cds-layer);
  border: none;
  padding: 32px 24px;
}
.index-card__label {
  font-size: 12px;
  font-weight: 500;
  color: var(--cds-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.index-card__value {
  font-size: 48px;
  line-height: 56px;
  font-weight: 700;
  color: var(--cds-button-primary);
  margin: 12px 0;
}
.index-card__tier {
  font-size: 14px;
  font-weight: 600;
  color: var(--cds-text-primary);
  margin-bottom: 16px;
}
.propensity-sig {
  font-size: 10px;
  background: var(--cds-background);
  border: 1px solid var(--cds-border-subtle);
  padding: 2px 6px;
  border-radius: 12px;
  color: var(--cds-text-primary);
}

/* Seller intelligence panel ---------------------------------------- */
/* On screen: lives inside the answers drawer (collapsed by default).  */
/* On print:  always rendered, regardless of drawer state.             */
.seller-intel {
  margin-top: 32px;
  padding: 20px 24px;
  background: #f4f4f4;
  border-left: 4px solid #0043ce;
}
.seller-intel__title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #0043ce;
  margin: 0 0 4px;
}

}

}
.str-card__level {

.str-card__title {

  font-weight: 600;

}
.str-card__desc {

}
.str-card__signals-title {

  font-weight: 600;

}

/* Act 2: Journey Pathways ------------------------------------------ */
.journey__header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-bottom: 1px solid var(--cds-border-subtle);
  padding-bottom: 16px;
  margin-bottom: 24px;
}
.journey__title {
  font-size: 18px;
  font-weight: 600;
  margin: 0;
}
.journey__status {
  font-size: 12px;
  font-weight: 500;
}
.txt-teal { color: #009d9a; font-weight: 600; }
.txt-purple { color: #8a3ffc; font-weight: 600; }

.journey__stepper {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 24px;
}
.st-pill {
  font-family: var(--font-sans);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 12px;
  background: var(--cds-layer);
  border: 1px solid transparent;
  border-top: 3px solid var(--cds-border-strong);
  text-align: left;
  cursor: pointer;
  transition: all 150ms ease;
  min-height: 84px;
}
.st-pill:hover {
  background: var(--cds-layer-hover);
}
.st-pill__num {
  font-size: 10px;
  font-weight: 600;
  color: var(--cds-text-secondary);
  text-transform: uppercase;
}
.st-pill__name {
  font-size: 11px;
  line-height: 14px;
  font-weight: 600;
  margin-top: 6px;
}
.st-pill__badge {
  position: absolute;
  bottom: 8px;
  left: 12px;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 2px;
  color: #ffffff;
}
.st-pill__badge--current {
  background: #009d9a;
}
.st-pill__badge--target {
  background: #8a3ffc;
}

/* Stepper state modifiers */
.st-pill.is-achieved {
  border-top-color: #24a148;
}
.st-pill.is-current {
  border-top-color: #009d9a;
  background: #f0fbfb;
}
.st-pill.is-target {
  border-top-color: #8a3ffc;
  background: #f7f3ff;
}
.st-pill.is-future {
  border-top-color: var(--cds-border-strong);
  opacity: 0.65;
}
.st-pill.is-active {
  box-shadow: 0 0 0 2px var(--cds-focus);
  opacity: 1;
}

.journey__details {
  background: var(--cds-layer);
  padding: 24px;
  border-radius: 4px;
}
.st-detail {
  display: none;
}
.st-detail.is-active {
  display: block;
}
.st-detail__grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
}
.st-detail__heading {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--cds-text-secondary);
  margin: 0 0 8px;
}
.st-detail__desc {
  font-size: 13px;
  line-height: 18px;
  margin-bottom: 20px;
}
.st-detail__desc:last-child {
  margin-bottom: 0;
}
.st-detail__outcomes ul {
  margin: 0;
  padding-left: 16px;
}
.st-detail__outcomes li {
  font-size: 12px;
  line-height: 16px;
  margin-bottom: 8px;
}
.st-detail__products {
  margin-top: 20px;
}
.prod-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.prod-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 2px;
}
.prod-badge--strong {
  background: #e8f1ff;
  color: var(--cds-button-primary);
}
.prod-badge--entry {
  background: #fff8e1;
  color: #b78103;
}
.prod-badge--unused {
  background: var(--cds-border-subtle);
  color: var(--cds-text-secondary);
}

/* Act 3: Action Plan ----------------------------------------------- */

}
.tp-badge {

}

}

}

/* Secondary Actions (Accordion) ------------------------------------ */

}

}

}

}

}
.sec-accordion__body {

  gap: 24px;
}
.sec-accordion__heading {

  font-weight: 600;

.rm-row__info {

.rm-row__id {

.rm-row__narrative {

/* Feedback Widget -------------------------------------------------- */
.feedback-widget {
  margin-top: 32px;
  display: flex;
  align-items: center;
  justify-content: justify;
  justify-content: space-between;
  background: var(--cds-layer);
  padding: 16px 24px;
  border-radius: 4px;
  border: 1px dashed var(--cds-border-subtle);
}
.feedback-widget__text {
  font-size: 13px;
  font-weight: 500;
}
.feedback-widget__buttons {
  display: flex;
  gap: 8px;
}
.feedback-widget__buttons.is-hidden {
  display: none;
}
.feedback-btn {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 12px;
  background: var(--cds-background);
  border: 1px solid var(--cds-border-subtle);
  border-radius: 2px;
  cursor: pointer;
  color: var(--cds-text-primary);
}
.feedback-btn:hover {
  background: var(--cds-layer-hover);
}
.feedback-widget__success {
  font-size: 12px;
  font-weight: 600;
  color: var(--cds-support-success);
}
.feedback-widget__success.is-hidden {
  display: none;
}

/* Report Footer ---------------------------------------------------- */
.rep-footer {
  margin-top: 48px;
  padding-top: 24px;
  text-align: center;
}
.rep-footer__rule {
  width: 100%;
  height: 1px;
  background: var(--cds-border-subtle);
  margin-bottom: 16px;
}
.rep-footer__text {
  font-size: 12px;
  color: var(--cds-text-secondary);
}

/* Responsive adjustments for Report ------------------------------- */
@media (max-width: 767px) {
  .rep-container {
    padding-top: 32px;
  }
  .rep-grid {
    grid-template-columns: 1fr;
  }
  .pillars-grid {
    grid-template-columns: 1fr;
  }
  .journey__stepper {
    grid-template-columns: 1fr;
  }
  .st-pill {
    min-height: 0;
  }
  .st-detail__grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .hero-action__body {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .sec-accordion__body {
    grid-template-columns: 1fr;
    gap: 16px;
  }
}

/* Print styles ----------------------------------------------------- */
/* The seller intelligence block is always printed even when the       */
/* answers drawer is collapsed on screen.                              */
@media print {
  /* Show the answers drawer content and seller block unconditionally */
  .ans-drawer.is-hidden,
  .ans-drawer {
    display: block !important;
  }

  .seller-intel {
    display: block !important;
    break-inside: avoid;
  }

  /* Hide interactive / screen-only chrome */
  .ans-drawer-trigger,
  .roadmap-btn,
  .feedback-widget,
  #btn-cta-contact,
  #btn-cta-submit,
  .cta-followup,
  .cta-success {
    display: none !important;
  }
}

      "description": "A trusted, consistent asset register in Maximo Manage with governance standards, unique asset records, and defined location hierarchy. Single source of truth for all field assets.",

      "signals": "• Asset records created with consistent naming conventions\n• Duplicate asset rate below threshold (establish organizational target)\n• Location-asset hierarchy established for at least one asset class\n• Governance workflow actively used for new asset creation\n• Asset specifications populated (installation data, expected life, purchase price) for at least one critical asset class\n• BOMs linked to assets for at least one critical asset class\n• Asset records free of duplicates and orphaned entries",

      "personas": "System Administrator; Asset Manager; Maintenance Supervisor",

      "resp_unknown": "It's unclear whether a standardised asset register has been established in your environment. To clarify, speak with your System Administrator or Asset Manager — they will know whether a single source of truth for asset records exists and whether a governance workflow is in place for new asset creation.",
      "is_under_review": false

// ── js/scoring.js ─────────────────────────────────────────
const PILLAR_WEIGHTS = {
  "Asset Data": 15,
  "Work Management": 15,
  "Inspections & Condition Capture": 10,
  "Supply Chain & Inventory": 10,
  "Reliability Practices": 15,
  "Condition Monitoring & Prediction": 15,
  "Scheduling": 10,
  "Assignment & Dispatch": 10,
};

const APM_GATING_MILESTONES = {
  1: ["AD-1-REG", "AD-1-CRIT", "CM-1-LF", "RP-1-FC"],
  2: ["AD-2-CLAS", "CM-2-HLTH", "CM-2-MON", "RP-2-RS", "RP-3-FMEA"],
  3: ["AD-2-HIER", "IC-3-METB", "CM-2-TRIG", "CM-3-IOT", "CM-3-MVAR", "SC-4-OPT"],
  4: ["CM-4-PRED", "CM-5-RCBF", "CM-6-LCFDBK", "RP-4-RCBF"],
  5: ["RP-5-FGOV"]
};

const FSM_GATING_MILESTONES = {
  1: ["AD-1-REG", "WM-1-JPBASIC", "IC-1-PROG", "SCH-1-DATES", "AS-1-OWN", "SC-1-REG", "WA-1-BAS"],
  2: ["AD-1-CRIT", "AD-2-CLAS", "WM-2-JPNEEDS", "IC-2-INSB", "SCH-2-FWD", "AS-2-CENT", "WA-2-ACT", "SC-2-BASICS"],
  3: ["AD-2-HIER", "WM-3-JPAR", "IC-3-METB", "CM-2-TRIG", "SCH-3-CONS", "AS-3-BEST", "WA-3-EFF", "SC-3-PLAN"],
  4: ["SC-4-OPT"],
  5: []
};

function parseStageNum(stageStr) {
  if (!stageStr) return 0;
  const matches = stageStr.match(/\d/g);
  if (!matches) return 0;
  return Math.max(...matches.map(Number));
}

function getStageLevel(states, gatingMilestones) {
  let highestMet = 0;
  for (let s = 1; s <= 5; s++) {
    const milestones = gatingMilestones[s];
    if (!milestones || milestones.length === 0) {
      highestMet = s;
      continue;
    }
    const allMet = milestones.every(mid => states[mid] === "MET");
    if (allMet) {
      highestMet = s;
    } else {
      break;
    }
  }
  return highestMet;
}

function runScoringEngine(answers) {
  // --- Pass 1: Resolve Milestone States ---
  const states = {};
  const rawStatuses = {};

  // Find all unique milestones in the assessment
  assessmentData.pages.forEach(p => {
    p.sections.forEach(s => {
      s.questions.forEach(q => {
        const ans = answers[q.id];
        if (q.type === "matrix") {
          q.rows.forEach(row => {
            if (!row.milestoneId) return;
            rawStatuses[row.milestoneId] = rawStatuses[row.milestoneId] || [];
            if (ans && ans[row.id]) {
              rawStatuses[row.milestoneId].push(
                ans[row.id] === "met" ? "MET" : ans[row.id] === "unmet" ? "UNMET" : "UNKNOWN"
              );
            } else {
              rawStatuses[row.milestoneId].push("UNKNOWN");
            }
          });
        } else if (q.binderType === "milestone-multiselect") {
          if (ans === undefined || ans === null) {
            q.options.forEach(o => {
              if (o.milestoneId) {
                rawStatuses[o.milestoneId] = rawStatuses[o.milestoneId] || [];
                rawStatuses[o.milestoneId].push("UNKNOWN");
              }
            });
          } else {
            const hasExclusive = q.options.some(o => o.exclusive && ans.includes(o.value));
            q.options.forEach(o => {
              if (!o.milestoneId) return;
              rawStatuses[o.milestoneId] = rawStatuses[o.milestoneId] || [];
              if (hasExclusive) {
                rawStatuses[o.milestoneId].push("UNMET");
              } else {
                rawStatuses[o.milestoneId].push(ans.includes(o.value) ? "MET" : "UNMET");
              }
            });
          }
        } else if (q.binderType === "milestone-ladder") {
          if (ans === undefined || ans === null) {
            q.options.forEach(o => {
              if (o.milestoneId) {
                rawStatuses[o.milestoneId] = rawStatuses[o.milestoneId] || [];
                rawStatuses[o.milestoneId].push("UNKNOWN");
              }
            });
          } else {
            const selectedOpt = q.options.find(o => o.value === ans);
            const selectedOrder = selectedOpt ? selectedOpt.order : 0;
            q.options.forEach(o => {
              if (!o.milestoneId) return;
              rawStatuses[o.milestoneId] = rawStatuses[o.milestoneId] || [];
              rawStatuses[o.milestoneId].push(o.order <= selectedOrder ? "MET" : "UNMET");
            });
          }
        }
      });
    });
  });

  // Default all 61 milestones in the graph list to UNKNOWN if not in rawStatuses
  reportData.milestones.forEach(m => {
    if (!rawStatuses[m.id]) {
      rawStatuses[m.id] = ["UNKNOWN"];
    }
  });

  // Resolve state
  for (const mid in rawStatuses) {
    const list = rawStatuses[mid];
    if (list.includes("MET")) {
      states[mid] = "MET";
    } else if (list.includes("UNMET")) {
      states[mid] = "UNMET";
    } else {
      states[mid] = "UNKNOWN";
    }
  }

  // --- Pass 2: Dimension Scores & Current Stages ---
  const dimensionCounts = {};
  for (const pid in PILLAR_WEIGHTS) {
    dimensionCounts[pid] = { met: 0, total: 0 };
  }

  reportData.milestones.forEach(m => {
    const pillar = m.pillar;
    if (pillar in PILLAR_WEIGHTS) {
      dimensionCounts[pillar].total += 1;
      if (states[m.id] === "MET") {
        dimensionCounts[pillar].met += 1;
      }
    }
  });

  const dimensionScores = {};
  let overallMaturity = 0;

  for (const pid in PILLAR_WEIGHTS) {
    const counts = dimensionCounts[pid];
    const score = counts.total > 0 ? (counts.met / counts.total) * 100 : 0;
    dimensionScores[pid] = {
      score: Math.round(score),
      metCount: counts.met,
      totalCount: counts.total,
      weight: PILLAR_WEIGHTS[pid]
    };
    overallMaturity += score * (PILLAR_WEIGHTS[pid] / 100);
  }

  overallMaturity = Math.round(overallMaturity);

  // Value Tiers
  let valueTier = "Level 1 (Unstructured / Reactive)";
  if (overallMaturity >= 90) {
    valueTier = "Level 5 (Prescriptive & Automated)";
  } else if (overallMaturity >= 75) {
    valueTier = "Level 4 (Predictive / Optimized)";
  } else if (overallMaturity >= 50) {
    valueTier = "Level 3 (Connected / Condition-Informed)";
  } else if (overallMaturity >= 25) {
    valueTier = "Level 2 (Core Operations / Baseline)";
  }

  const currentAPMStageNum = getStageLevel(states, APM_GATING_MILESTONES);
  const currentFSMStageNum = getStageLevel(states, FSM_GATING_MILESTONES);

  // --- Pass 3: Target Horizons ---
  const selectedObjectives = answers["Q-OBJ"] || [];
  const objQuestion = assessmentData.pages[0].sections[0].questions.find(q => q.id === "Q-OBJ");

  let maxAPMTarget = 0;
  let maxFSMTarget = 0;

  selectedObjectives.forEach(val => {
    const opt = objQuestion.options.find(o => o.value === val);
    if (opt) {
      const apmNum = parseStageNum(opt.apmStage);
      const fsmNum = parseStageNum(opt.fsmStage);
      if (apmNum > maxAPMTarget) maxAPMTarget = apmNum;
      if (fsmNum > maxFSMTarget) maxFSMTarget = fsmNum;
    }
  });

  const apmTargetStageNum = maxAPMTarget > 0 ? maxAPMTarget : Math.min(5, currentAPMStageNum + 1);
  const fsmTargetStageNum = maxFSMTarget > 0 ? maxFSMTarget : Math.min(5, currentFSMStageNum + 1);

  // Top Met Milestones (Strengths)
  const metMilestones = reportData.milestones.filter(m => states[m.id] === "MET");
  const sortedStrengths = [...metMilestones].sort((a, b) => {
    const aLvl = parseInt(a.level.replace(/\D/g, '')) || 1;
    const bLvl = parseInt(b.level.replace(/\D/g, '')) || 1;
    if (bLvl !== aLvl) return bLvl - aLvl; // level DESC

    const aWeight = PILLAR_WEIGHTS[a.pillar] || 0;
    const bWeight = PILLAR_WEIGHTS[b.pillar] || 0;
    if (bWeight !== aWeight) return bWeight - aWeight; // pillar weight DESC

    return a.id.localeCompare(b.id); // alphabetical tie-breaker
  });
  const topStrengths = sortedStrengths.slice(0, 3);

  // --- Pass 4: Top 3 Action Prioritization (Strict Hierarchical Sort) ---
  const initialCandidates = new Set();

  reportData.milestones.forEach(m => {
    if (states[m.id] === "UNMET") {
      const apmLvl = m.apm_stage !== "—" ? parseInt(m.apm_stage.replace(/\D/g, '')) : 99;
      const fsmLvl = m.fsm_stage !== "—" ? parseInt(m.fsm_stage.replace(/\D/g, '')) : 99;

      const fitsAPM = m.apm_stage !== "—" && apmLvl <= apmTargetStageNum;
      const fitsFSM = m.fsm_stage !== "—" && fsmLvl <= fsmTargetStageNum;

      if (fitsAPM || fitsFSM) {
        initialCandidates.add(m.id);
      }
    }
  });

  // Shared Prerequisites transitive closure (incorporate unblocked ancestral unmet milestones)
  const candidateIds = new Set(initialCandidates);
  let addedNew = true;
  while (addedNew) {
    addedNew = false;
    reportData.links.forEach(link => {
      // If target is a candidate and source is UNMET, then source is a prerequisite candidate
      if (candidateIds.has(link.target)) {
        if (states[link.source] === "UNMET" && !candidateIds.has(link.source)) {
          candidateIds.add(link.source);
          addedNew = true;
        }
      }
    });
  }

  // Helper lists of gating milestones for target calculations
  const nextAPMGating = APM_GATING_MILESTONES[currentAPMStageNum + 1] || [];
  const nextFSMGating = FSM_GATING_MILESTONES[currentFSMStageNum + 1] || [];

  const selectedObstacles = answers["Q-OBS"] || [];
  const obsQuestion = assessmentData.pages[0].sections[0].questions.find(q => q.id === "Q-OBS");

  // Score candidates with deterministic strict sorting tuple
  const candidateMilestones = reportData.milestones.filter(m => candidateIds.has(m.id));
  const scoredCandidates = candidateMilestones.map(m => {
    // 1. is_gating_next
    const isAPMGating = nextAPMGating.includes(m.id);
    const isFSMGating = nextFSMGating.includes(m.id);
    const is_gating_next = (isAPMGating || isFSMGating) ? 1 : 0;

    // 2. is_unlocked (all incoming prerequisites are MET)
    const incomingLinks = reportData.links.filter(l => l.target === m.id);
    const is_unlocked = incomingLinks.every(l => states[l.source] === "MET") ? 1 : 0;

    // 3. level ASC (Pillar level as integer)
    const level = parseInt(m.level.replace(/\D/g, '')) || 1;

    // 4. obstacle_match (2 for primary obstacle match, 1 for secondary, 0 for none)
    let obstacle_match = 0;
    let matchingObstacleOpt = null;
    selectedObstacles.forEach(val => {
      const opt = obsQuestion.options.find(o => o.value === val);
      if (opt) {
        if (opt.milestoneId === m.id) {
          obstacle_match = 2;
          matchingObstacleOpt = opt;
        } else if (opt.secondaryMilestoneId === m.id && obstacle_match < 2) {
          obstacle_match = 1;
          matchingObstacleOpt = opt;
        }
      }
    });

    return {
      milestone: m,
      is_gating_next,
      is_unlocked,
      level,
      obstacle_match,
      matchingObstacleOpt,
      id: m.id
    };
  });

  // Sort candidates using strict multi-key sorting tuple:
  // Tuple = (is_gating_next DESC, is_unlocked DESC, level ASC, obstacle_match DESC, id ASC)
  scoredCandidates.sort((a, b) => {
    if (b.is_gating_next !== a.is_gating_next) {
      return b.is_gating_next - a.is_gating_next;
    }
    if (b.is_unlocked !== a.is_unlocked) {
      return b.is_unlocked - a.is_unlocked;
    }
    if (a.level !== b.level) {
      return a.level - b.level;
    }
    if (b.obstacle_match !== a.obstacle_match) {
      return b.obstacle_match - a.obstacle_match;
    }
    return a.id.localeCompare(b.id);
  });

  // Attribution Tag Generation
  scoredCandidates.forEach(c => {
    if (c.obstacle_match > 0 && c.matchingObstacleOpt) {
      c.attributionTag = `Overcomes Stated Obstacle: ${c.matchingObstacleOpt.label}`;
    } else {
      const tracks = [];
      if (c.milestone.apm_stage !== "—") {
        tracks.push(`APM Stage ${c.milestone.apm_stage.replace(/\D/g, '')}`);
      }
      if (c.milestone.fsm_stage !== "—") {
        tracks.push(`FSM Stage ${c.milestone.fsm_stage.replace(/\D/g, '')}`);
      }
      c.attributionTag = `Foundational prerequisite for ${tracks.join(" & ")}`;
    }
  });

  // Separate into Hero (Rank 1), Secondary (Ranks 2-3), and remaining summary list
  const heroAction = scoredCandidates[0] || null;
  const secondaryActions = scoredCandidates.slice(1, 3);
  const remainingRoadmap = scoredCandidates.slice(3);

  // --- Growth Propensity Scoring & Signals ---
  let propensityScore = 0;
  const propensitySignals = [];
  const appetitePage = assessmentData.pages.find(p => p.id === "follow-up");
  if (appetitePage) {
    appetitePage.sections[0].questions.forEach(q => {
      const ans = answers[q.id];
      if (ans) {
        const opt = q.options.find(o => o.value === ans);
        if (opt) {
          if (opt.score !== undefined && opt.score !== null) propensityScore += opt.score;
          if (opt.signalLabel) propensitySignals.push(opt.signalLabel);
        }
      }
    });
  }

  return {
    states,
    dimensionScores,
    overallMaturity,
    valueTier,
    currentAPMStageNum,
    currentFSMStageNum,
    apmTargetStageNum,
    fsmTargetStageNum,
    topStrengths,
    heroAction,
    secondaryActions,
    remainingRoadmap,
    propensityScore,
    propensitySignals,
    scoredCandidates
  };
}

    topStrengths,
    heroAction,
