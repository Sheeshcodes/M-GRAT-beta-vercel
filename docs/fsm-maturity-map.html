<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FSM Maturity Map · Field Service Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Serif:wght@300&family=IBM+Plex+Sans+Condensed:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #161616;
      background: #f4f4f4;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .map-header {
      background: #d0e2ff;
      padding: 100px 56px;
      position: relative;
    }
    .map-header__inner {
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .map-header__title {
      font-family: 'IBM Plex Serif', serif;
      font-size: 48px;
      font-weight: 300;
      line-height: 1.1;
      color: #000;
    }
    .map-header__subtitle {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 20px;
      font-weight: 400;
      line-height: 28px;
      color: #161616;
    }
    .map-header__ibm-logo {
      position: absolute;
      top: 24px;
      right: 56px;
      width: 80px;
    }

    /* ── Download button ─────────────────────────────────────── */
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 16px;
      background: #0f62fe;
      color: #fff;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 70ms;
      align-self: flex-start;
    }
    .btn-download:hover { background: #0353e9; }
    .btn-download svg { flex-shrink: 0; }

    /* ── Stage grid ──────────────────────────────────────────── */
    .map-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 24px 24px 64px;
    }

    /* ── Stage card ──────────────────────────────────────────── */
    .stage-card {
      background: #fff;
      box-shadow: 0 1px 0.75px rgba(0,0,0,0.1), 0 1px 0.5px rgba(0,0,0,0.1);
      border-radius: 2px;
      display: flex;
      flex-direction: column;
    }
    .stage-card__body {
      flex: 1;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
    }

    /* Stage label */
    .stage-label {
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 16px;
      letter-spacing: 0.32px;
      color: #a8a8a8;
      margin-bottom: 16px;
      height: 18px;
    }
    .stage-label__target { color: #0f62fe; }
    .stage-label__target--purple { color: #8a3ffc; }

    /* Stage name */
    .stage-name {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 20px;
      font-weight: 400;
      line-height: 28px;
      color: #161616;
      margin-bottom: 16px;
    }

    /* Stage quote */
    .stage-quote {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      font-style: italic;
      line-height: 20px;
      letter-spacing: -0.23px;
      color: #525252;
      margin-bottom: 24px;
    }

    /* Ready box */
    .stage-ready {
      background: #f4f4f4;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stage-ready__header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stage-ready__label {
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      letter-spacing: 0.32px;
      color: #161616;
    }
    .stage-ready__text {
      font-size: 14px;
      font-weight: 400;
      line-height: 18px;
      letter-spacing: 0.16px;
      color: #161616;
    }

    /* Section labels */
    .stage-section-label {
      font-size: 12px;
      font-weight: 700;
      line-height: 16px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #525252;
      margin-bottom: 12px;
    }

    /* Bullet / arrow lists */
    .stage-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stage-list__item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .stage-list__bullet {
      font-size: 14px;
      font-weight: 700;
      line-height: 20px;
      color: #0f62fe;
      flex-shrink: 0;
    }
    .stage-list__bullet--purple { color: #8a3ffc; }
    .stage-list__arrow {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: #0f62fe;
      flex-shrink: 0;
    }
    .stage-list__arrow--purple { color: #8a3ffc; }
    .stage-list__text {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: #161616;
    }
    .stage-list__text strong { font-weight: 600; }

    /* ── Metric footer ───────────────────────────────────────── */
    .stage-card__metrics {
      border-top: 1px solid #e0e0e0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    .metric-item {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-right: 1px solid #e0e0e0;
    }
    .metric-item:last-child { border-right: none; }
    .metric-item__dots {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .metric-dot {
      width: 12px;
      height: 3px;
      border-radius: 2px;
      background: #dadada;
    }
    .metric-dot--blue   { background: #0f62fe; }
    .metric-dot--purple { background: #8a3ffc; }
    .metric-item__label {
      font-size: 11px;
      font-weight: 400;
      line-height: 14px;
      color: #525252;
    }
    .arrow-up-icon, .arrow-down-icon {
      display: block;
      width: 14px;
      height: 14px;
    }

    /* ── Print styles ────────────────────────────────────────── */
    @page {
      size: auto;
      margin: 0;
    }
    @media print {
      html, body {
        width: 100%;
        height: auto;
        overflow: visible;
        background: #fff;
      }
      * {
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .btn-download { display: none !important; }
      .map-header { padding: 48px 40px; }
      .map-grid {
        padding: 16px 16px 32px;
        gap: 4px;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 900px) {
      .map-grid { grid-template-columns: repeat(2, 1fr); }
      .map-header { padding: 56px 24px; }
      .map-header__ibm-logo { right: 24px; }
    }
    @media (max-width: 560px) {
      .map-grid { grid-template-columns: 1fr; }
      .map-header__title { font-size: 32px; }
    }
  </style>
</head>
<body>

  <!-- ══ HEADER ══════════════════════════════════════════════ -->
  <header class="map-header">
    <img class="map-header__ibm-logo" src="assets/ibm-logo.svg" alt="IBM" />
    <div class="map-header__inner">
      <h1 class="map-header__title">Plan your next move</h1>
      <p class="map-header__subtitle">Assess where field operations stand today and advance toward autonomous, self-optimizing field service.</p>
      <button class="btn-download" onclick="window.print()">
        Download PDF
        <svg viewBox="0 0 32 32" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M26 24v4H6v-4H4v4a2 2 0 002 2h20a2 2 0 002-2v-4z"/>
          <path d="M26 14l-1.41-1.41L17 20.17V2h-2v18.17l-7.59-7.58L6 14l10 10 10-10z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ══ STAGE GRID ═══════════════════════════════════════════ -->
  <main class="map-grid" id="map-grid"></main>

  <script type="module">
    import JOURNEY from '../data/journey.js';

    const SVG_CHECK = `<svg viewBox="0 0 32 32" width="16" height="16" fill="none" stroke="#161616" stroke-width="2" aria-hidden="true"><circle cx="16" cy="16" r="13"/><polyline points="10,16 14,20 22,12"/></svg>`;
    const SVG_UP    = `<svg class="arrow-up-icon" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 4l-10 10h6v14h8V14h6z"/></svg>`;
    const SVG_DOWN  = `<svg class="arrow-down-icon" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 28l10-10h-6V4h-8v14H6z"/></svg>`;

    // Metric footer config per stage (not in Excel — purely visual KPI indicators).
    const FSM_METRICS = {
      FSM2: [
        { direction: 'up',   dots: 1, label: 'Technician productivity' },
        { direction: 'down', dots: 1, label: 'Dispatch overhead'       },
        { direction: 'up',   dots: 1, label: 'First-time fix rate'     },
      ],
      FSM3: [
        { direction: 'up',   dots: 2, label: 'Technician productivity' },
        { direction: 'down', dots: 2, label: 'Dispatch overhead'       },
        { direction: 'up',   dots: 2, label: 'First-time fix rate'     },
      ],
      FSM4: [
        { direction: 'up',   dots: 3, label: 'Technician productivity' },
        { direction: 'down', dots: 3, label: 'Dispatch overhead'       },
        { direction: 'up',   dots: 3, label: 'First-time fix rate'     },
      ],
      FSM5: [
        { direction: 'up',   dots: 4, label: 'Technician productivity' },
        { direction: 'down', dots: 4, label: 'Dispatch overhead'       },
        { direction: 'up',   dots: 4, label: 'First-time fix rate'     },
      ],
    };

    function dots(count, purple) {
      const cls = purple ? 'metric-dot--purple' : 'metric-dot--blue';
      return Array.from({ length: 4 }, (_, i) =>
        `<div class="metric-dot${i < count ? ' ' + cls : ''}"></div>`
      ).join('');
    }

    function renderMetrics(stageId, purple) {
      const metrics = FSM_METRICS[stageId] || [];
      return metrics.map(m => `
        <div class="metric-item">
          ${m.direction === 'up' ? SVG_UP : SVG_DOWN}
          <div class="metric-item__dots">${dots(m.dots, purple)}</div>
          <span class="metric-item__label">${m.label}</span>
        </div>`).join('');
    }

    // FSM maturity map shows stages FSM2–FSM5 (the 4 transition cards)
    const displayStages = JOURNEY.fsm.filter(s => s.stage >= 2);

    const grid = document.getElementById('map-grid');
    grid.innerHTML = displayStages.map(stage => {
      const from  = stage.stage - 1;
      const to    = stage.stage;
      const purple = stage.stage >= 4;
      const accentCls = purple ? ' stage-label__target--purple' : '';
      const bulletCls = purple ? ' stage-list__bullet--purple' : '';
      const arrowCls  = purple ? ' stage-list__arrow--purple'  : '';

      const gainItems = stage.potentialOutcomes.map(o => `
        <li class="stage-list__item">
          <span class="stage-list__bullet${bulletCls}" aria-hidden="true">•</span>
          <span class="stage-list__text"><strong>${o.stat}</strong> ${o.label}</span>
        </li>`).join('');

      const moveItems = (stage.keyMoves || []).map(m => `
        <li class="stage-list__item">
          <span class="stage-list__arrow${arrowCls}" aria-hidden="true">→</span>
          <span class="stage-list__text">${m}</span>
        </li>`).join('');

      return `
      <article class="stage-card">
        <div class="stage-card__body">
          <p class="stage-label">STAGE ${from} → <span class="stage-label__target${accentCls}">STAGE ${to}</span></p>
          <h2 class="stage-name">${stage.name}</h2>
          <p class="stage-quote">"${stage.description}"</p>

          <div class="stage-ready">
            <div class="stage-ready__header">
              ${SVG_CHECK}
              <span class="stage-ready__label">Are you ready?</span>
            </div>
            <p class="stage-ready__text">${stage.readinessText || stage.valueStatement}</p>
          </div>

          <p class="stage-section-label">What you gain</p>
          <ul class="stage-list" aria-label="What you gain at ${stage.name} stage">${gainItems}</ul>

          <p class="stage-section-label">Key moves to get there</p>
          <ul class="stage-list" aria-label="Key moves for ${stage.name} stage">${moveItems}</ul>
        </div>

        <div class="stage-card__metrics">${renderMetrics(stage.id, purple)}</div>
      </article>`;
    }).join('');
  </script>

</body>
</html>
